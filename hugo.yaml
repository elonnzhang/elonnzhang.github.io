baseURL: https://jiabin.dev/
defaultContentLanguage: zh
timeZone: Asia/Shanghai
languages:
  zh:
    locale: zh-CN
    label: Chinese
    weight: 1
title: elonnzhang
theme: archie
enableRobotsTXT: true
ignoreFiles:
  - (^|/)AGENTS\.md$
paginate: 10
permalinks:
  posts: /blog/:slug
  clippings: /clippings/:slug
  code-space: /code-space/:slug
taxonomies:
  category: categories
  tag: tags
markup:
  goldmark:
    renderer:
      unsafe: true
  highlight:
    noClasses: false
    codeFences: true
outputs:
  home: [HTML, RSS]
  section: [HTML, RSS]
  page: [HTML]
outputFormats:
  RSS:
    mediaType: application/rss+xml
    baseName: index
    isHTML: false
    isPlainText: true
    rel: alternate
params:
  mode: toggle
  favicon: /assets/favicon.png
  customJS:
    - assets/js/eink-init.js
  customCSS:
    - css/chroma.css
    - css/neat-annotations.css
    - css/tui-patch.css
  mainSections:
    - posts
    - clippings
    - code-space
  owner: elonnzhang
  authorEmail: elonnzhang@gmail.com
  description: BLOG / engineering notes on Go, systems, databases and AI tools.
  siteTagline: Systems, code, and things worth understanding.
  subtitle: Systems, code, and things worth understanding.
  customDomain: jiabin.dev
  defaultDomain: elonnzhang.github.io
  remoteAssets:
    enabled: false
    baseURL: https://blog-assets.jiabin.dev
  social:
    - name: GitHub
      icon: github
      url: https://github.com/elonnzhang
    - name: Email
      icon: mail
      url: mailto:elonnzhang@gmail.com
menu:
  main:
    - name: Home
      url: /
      weight: 1
    - name: Blog
      url: /blog/
      weight: 2
    - name: Clippings
      url: /clippings/
      weight: 3
    - name: Archive
      url: /archive/
      weight: 4
    - name: About
      url: /about/
      weight: 5
    - name: Tags
      url: /tags/
      weight: 6
services:
  rss:
    limit: 20

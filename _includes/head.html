<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="generator" content="Jekyll">
  <meta name="color-scheme" content="light dark">
  <meta id="theme-color" name="theme-color" content="#f7f7f2">

  <script>
    (function () {
      var root = document.documentElement;
      var ua = navigator.userAgent || "";
      var theme = "";
      var isKindleEink = /\bKindle(?:\/|\s(?!Fire))/i.test(ua) &&
        !/\bSilk\//i.test(ua);
      var isEinkPreview = /(?:\?|&)eink=1(?:&|$)/.test(window.location.search);
      var isWebPreview = /(?:\?|&)web=1(?:&|$)/.test(window.location.search);
      var isForcedEink =
        {% if page.force_eink %}true{% else %}false{% endif %} &&
        !isWebPreview;
      var isEink = isKindleEink || isEinkPreview || isForcedEink;
      var spaceArrival = "";
      var colorScheme = document.getElementsByName("color-scheme")[0];
      var themeColor = document.getElementById("theme-color");

      root.className += (root.className ? " " : "") + "js";
      if (!("open" in document.createElement("details"))) {
        root.className += " no-details";
      }

      try {
        spaceArrival = window.sessionStorage.getItem(
          "elonnzhang-space-arrival"
        ) || "";
        window.sessionStorage.removeItem("elonnzhang-space-arrival");
      } catch (error) {}

      if (spaceArrival === "ink-reader" && !isKindleEink) {
        root.className += " space-arrival-ink-reader";
      }

      if (isEink) {
        root.className += (root.className ? " " : "") + "eink";
        root.setAttribute("data-eink", "true");
        if (isEinkPreview) {
          root.setAttribute("data-eink-preview", "true");
        }
        if (isKindleEink) {
          root.setAttribute("data-kindle", "true");
        }
        root.setAttribute("data-theme", "light");
        if (colorScheme) {
          colorScheme.setAttribute("content", "light");
        }
        if (themeColor) {
          themeColor.setAttribute("content", "#ffffff");
        }
        return;
      }

      try {
        theme = window.localStorage.getItem("elonnzhang-theme") || "";
      } catch (error) {}

      if (theme !== "light" && theme !== "dark") {
        theme = window.matchMedia &&
          window.matchMedia("(prefers-color-scheme: dark)").matches
          ? "dark"
          : "light";
      }
      root.setAttribute("data-theme", theme);
      if (themeColor) {
        themeColor.setAttribute(
          "content",
          theme === "dark" ? "#111210" : "#f7f7f2"
        );
      }
    }());
  </script>
  <link rel="stylesheet" href="{{ "/css/main.css" | relative_url }}?v={{ site.time | date: "%s" }}">
  <link href="{{ "/atom.xml" | relative_url }}" type="application/atom+xml" rel="alternate" title="{{ site.title }} Atom Feed">
  {% seo %}
</head>
